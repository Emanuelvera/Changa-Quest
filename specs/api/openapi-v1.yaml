openapi: 3.0.3
info:
  title: Changa Quest API
  version: 1.0.0
  description: Contrato canÃ³nico para registro, verificaciÃ³n y acceso de la demo local.
servers:
  - url: /
paths:
  /api/v1/accounts/register:
    post:
      operationId: registerAdultAccount
      summary: Crea una cuenta pendiente de verificaciÃ³n
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        "202":
          description: Cuenta creada; no inicia sesiÃ³n. En Development, el enlace se registra en la consola local.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRegistrationAccepted"
        "400":
          $ref: "#/components/responses/ValidationProblem"
  /api/v1/accounts/confirm-email:
    get:
      operationId: confirmAccountEmail
      summary: Verifica el correo con un token de un solo uso
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Correo verificado; la persona puede iniciar sesiÃ³n.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
  /api/v1/accounts/login:
    post:
      operationId: signInAccount
      summary: Inicia sesiÃ³n solo con cuenta adulta y correo verificado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: SesiÃ³n autenticada mediante cookie HttpOnly de mismo origen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              description: Cookie de sesiÃ³n HttpOnly; nunca se devuelve un token para almacenamiento JavaScript.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/ValidationProblem"
  /api/v1/accounts/logout:
    post:
      operationId: signOutAccount
      security:
        - cookieAuth: []
      responses:
        "204":
          description: SesiÃ³n cerrada.
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/accounts/me:
    get:
      operationId: getCurrentAccount
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Perfil de la cuenta autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/changas:
    get:
      operationId: listAvailableChangas
      summary: Busca changas disponibles dentro de un radio manual
      security:
        - cookieAuth: []
      parameters:
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          description: Latitud ficticia de la ubicación manual de búsqueda.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          description: Longitud ficticia de la ubicación manual de búsqueda.
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 3, 5, 10]
            default: 3
          description: Radio de búsqueda permitido en kilómetros.
        - name: savePreference
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Guarda explícitamente la ubicación manual como preferencia.
      responses:
        "200":
          description: Tablón filtrado por distancia; nunca incluye la dirección exacta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Changa"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "400":
          $ref: "#/components/responses/ValidationProblem"
    post:
      operationId: createChanga
      summary: Publica una changa como disponible
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangaRequest"
      responses:
        "201":
          description: Changa creada y disponible.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changa"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/changas/{id}:
    get:
      operationId: getAvailableChanga
      summary: Consulta el detalle público de una changa disponible
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle público sin dirección exacta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changa"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ChangaQuest.Auth
  schemas:
    CreateChangaRequest:
      type: object
      required: [description, reward, zone, exactAddress, materialsNeeded]
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 1000
          description: Las longitudes se miden después de quitar espacios al inicio y al final.
        reward:
          type: integer
          minimum: 1
          maximum: 10000000
          description: Recompensa entera en pesos argentinos (ARS).
        zone:
          type: string
          minLength: 3
          maxLength: 80
          description: Barrio o zona aproximada; es pública. Longitud medida sin espacios al inicio y al final.
        exactAddress:
          type: string
          minLength: 5
          maxLength: 200
          writeOnly: true
          description: Dirección privada; nunca se devuelve en este contrato. Longitud medida sin espacios al inicio y al final.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Coordenada ficticia opcional de demo para búsquedas por cercanía.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Coordenada ficticia opcional de demo para búsquedas por cercanía.
        materialsNeeded:
          type: boolean
          description: Respuesta explícita sobre si hacen falta herramientas o materiales.
        materialsProvider:
          type: string
          enum: [requester, worker]
          description: Obligatorio si materialsNeeded es true; se omite si es false.
      oneOf:
        - required: [materialsNeeded]
          properties:
            materialsNeeded:
              type: boolean
              enum: [false]
          not:
            required: [materialsProvider]
        - required: [materialsNeeded, materialsProvider]
          properties:
            materialsNeeded:
              type: boolean
              enum: [true]
            materialsProvider:
              type: string
              enum: [requester, worker]
    Changa:
      type: object
      required: [id, description, reward, zone, materialsNeeded, materialsProvider, status, assignmentMode, isSample, createdAt, distanceKm]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        reward:
          type: integer
          description: Recompensa publicada en ARS; no representa un pago procesado.
        zone:
          type: string
        materialsNeeded:
          type: boolean
        materialsProvider:
          type: string
          nullable: true
          enum: [requester, worker, null]
        status:
          type: string
          enum: [available]
        assignmentMode:
          type: string
          enum: [first_come]
        isSample:
          type: boolean
          description: Indica datos ficticios de muestra; el cliente debe rotularlos como Ejemplo ficticio.
        createdAt:
          type: string
          format: date-time
        distanceKm:
          type: number
          format: double
          minimum: 0
          description: Distancia aproximada en línea recta desde la ubicación de búsqueda.
    AccountRegistrationAccepted:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    RegisterAccountRequest:
      type: object
      required: [email, password, declaredAdult]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          description: Sin requisitos de composiciÃ³n.
        declaredAdult:
          type: boolean
          description: DeclaraciÃ³n afirmativa de tener 18 aÃ±os o mÃ¡s; no se almacena fecha ni documento.
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CurrentAccount:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
  responses:
    Problem:
      description: Error conforme a Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Error de validaciÃ³n conforme a Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
